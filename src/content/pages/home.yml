seo:
  title: Moments - A photography Astro theme for weddings and portraits
  description: "An image-led Astro theme for a solo wedding and portrait photographer: full-bleed openings, a masonry wall of work, and galleries packed into justified rows so no photograph is cropped to fit a grid."
heading: Moments — Wedding and portrait photography, quietly observed
